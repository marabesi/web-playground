<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Pixi.js Touch Interaction</title>
    <link rel="stylesheet" href="touch-style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>👆 Touch & Move</h1>
            <p>Tap and drag objects around</p>
        </header>
        <div id="game-container">
            <div class="loading">Loading...</div>
        </div>
        <div class="stats">
            <span>Objects: <strong id="objectCount">0</strong></span>
            <span>FPS: <strong id="fps">60</strong></span>
        </div>
        <div class="controls">
            <button id="addObject">+ Add Object</button>
            <button id="clearAll">Clear All</button>
        </div>
    </div>
    <script async src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
    <script src="touch-main.js"></script>
</body>
</html>
